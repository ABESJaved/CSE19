<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Webpage</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        /* Navbar */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #333;
            padding: 15px 30px;
        }

        .logo {
            color: white;
            font-size: 22px;
            font-weight: bold;
        }

        .menu {
            display: flex;
            gap: 20px;
        }

        .menu a {
            text-decoration: none;
            color: white;
            font-size: 16px;
        }

        .menu a:hover {
            color: yellow;
        }

        /* Hero Section */
        .hero {
            height: 300px;
            background-color: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .hero h1 {
            font-size: 32px;
            margin-bottom: 10px;
        }

        .hero p {
            font-size: 18px;
            color: #555;
        }

        /* About Section */
        .about {
            padding: 40px;
            text-align: center;
        }

        .about h2 {
            margin-bottom: 15px;
            font-size: 26px;
        }

        .about p {
            font-size: 17px;
            color: #444;
            max-width: 600px;
            margin: auto;
        }

        /* Footer */
        .footer {
            background-color: #333;
            color: white;
            text-align: center;
            padding: 15px;
            margin-top: 30px;
        }

        /* Mobile View */
        @media (max-width: 600px) {
            .navbar {
                flex-direction: column;
                align-items: flex-start;
            }

            .menu {
                flex-direction: column;
                margin-top: 10px;
            }

            .hero {
                height: 200px;
                padding: 20px;
            }

            .hero h1 {
                font-size: 24px;
            }
        }
    </style>
</head>

<body>

    <!-- Navbar -->
    <nav class="navbar">
        <div class="logo">My Website</div>

        <div class="menu">
            <a href="#">Home</a>
            <a href="#">About</a>
            <a href="#">Services</a>
            <a href="#">Contact</a>
        </div>
    </nav>

    <!-- Hero Section -->
    <section class="hero">
        <div>
            <h1>Welcome to My Website</h1>
            <p>Learning web development is fun.</p>
        </div>
    </section>

    <!-- About Section -->
    <section class="about">
        <h2>About</h2>
        <p>
            This page is a basic example of a webpage layout with a navigation bar,
            content section, and footer. It is designed to adjust on different screen sizes.
        </p>
    </section>

    <!-- Footer -->
    <div class="footer">
        <p>© 2026 My Website</p>
    </div>

</body>
</html>
